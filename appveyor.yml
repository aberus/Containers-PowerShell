version: '{build}'
pull_requests:
  do_not_increment_build_number: true
image: WMF 5
init:
- ps: Install-PackageProvider NuGet -Force
- ps: (new-object net.webclient).DownloadFile('https://raw.githubusercontent.com/dotnet/cli/master/scripts/obtain/dotnet-install.ps1', "C:/dotnet-install.ps1")
- ps: C:/dotnet-install.ps1
install:
- ps: Install-Module Microsoft.PowerShell.PlatyPS -Force
- cmd: git submodule update --init --recursive
nuget:
  disable_publish_on_pr: true
build_script:
- ps: $psversiontable
- ps: dotnet --version
- ps: get-packageprovider nuget
- ps: ipmo Microsoft.PowerShell.PlatyPS ; get-module -name Microsoft.PowerShell.PlatyPS
- ps: |
    $env:PATH = "c:\program files\dotnet;$env:PATH"

    $projectFile = "src\Docker.PowerShell\Docker.PowerShell.csproj"
    $projectRawContents = Get-Content $projectFile -Raw
    $versionNodes =  $projectRawContents | Select-Xml -XPath "/Project/PropertyGroup/Version"
    if ($versionNodes.Count -ne 1) {
      throw "Invalid number of version nodes found in csproj."
    }

    $version = $versionNodes.Node.InnerXml

    # Tags do not get build versions.
    if ($env:APPVEYOR_REPO_TAG -ne "true") {
      $version += ".$($env:APPVEYOR_BUILD_VERSION.split("-")[0])"

      # Update the .csproj version to include the build number.
      $newProjectContents = $projectRawContents -replace "<Version>.+</Version>", "<Version>$version</Version>"
      $newProjectContents | Out-File -Encoding UTF8 $projectFile
    }

    # Replace module manifest version.
    $manifest = "src\Docker.PowerShell\Docker.psd1"
    (Get-Content $manifest -Raw) -replace "ModuleVersion.+","ModuleVersion = '$version'" | Out-File $manifest

    Get-Content $projectFile
    Get-Content $manifest
- ps: dotnet restore src/Docker.PowerShell/Docker.PowerShell.csproj
- ps: dotnet build src/Docker.PowerShell/Docker.PowerShell.csproj
- ps: dotnet publish -f net46 -o $pwd\bin\Docker\clr -c Release $pwd\src\Docker.PowerShell
- ps: dotnet publish -f netstandard1.6 -o $pwd\bin\Docker\coreclr -c Release $pwd\src\Docker.PowerShell
- ps: nuget install Newtonsoft.Json -Version 9.0.1 -OutputDirectory $pwd\bin
- ps: cp $pwd\bin\Docker\coreclr\Docker.*ps* $pwd\bin\Docker\
- ps: cp $pwd\bin\Newtonsoft.Json.9.0.1\lib\portable-net45+wp80+win8+wpa81\Newtonsoft.Json.dll $pwd\bin\Docker\coreclr\Newtonsoft.Json.dll
- ps: |
    # Compile the help markdown (Microsoft.PowerShell.PlatyPS, schema 2024-05-01) into the MAML
    # the module loads at runtime. Only the command files are compiled; Help\Docker.md is the
    # module landing page. Export-MamlCommandHelp writes into a folder named for the module, so
    # the result is copied up into en-US.
    Import-Module Microsoft.PowerShell.PlatyPS
    $helpMarkdown = (Measure-PlatyPSMarkdown -Path $pwd\src\Docker.PowerShell\Help\*.md |
        Where-Object FileType -match 'CommandHelp').FilePath
    $mamlStaging = Join-Path $pwd "bin\maml"
    $null = Export-MamlCommandHelp -CommandHelp (Import-MarkdownCommandHelp -Path $helpMarkdown) -OutputFolder $mamlStaging -Force
    $null = New-Item -ItemType Directory -Force -Path $pwd\bin\Docker\en-US
    Copy-Item (Join-Path $mamlStaging "Docker\*.xml") $pwd\bin\Docker\en-US -Force
    Remove-Item $mamlStaging -Recurse -Force
- ps: mkdir $pwd\testRepo
- ps: Register-PSRepository -Name test -SourceLocation $pwd\testRepo
- ps: Publish-Module -Path $pwd\bin\Docker -Repository test
test_script:
- ps: Install-Module -Name Docker -Repository test -Force
- ps: Import-Module Docker
- ps: |
    if (!(gcm -Module Docker)){
      throw "Module failed to load: no commands found."
    }
- ps: git checkout -- src/Docker.PowerShell/Docker.psd1
- ps: git checkout -- src/Docker.PowerShell/Docker.PowerShell.csproj
- ps: git config core.autocrlf true
- ps: |
    # The help markdown must still describe the cmdlets the build produced. Update-MarkdownCommandHelp
    # is additive rather than idempotent, so comparing regenerated files byte for byte would always
    # report a difference; compare the parsed help against the live commands instead.
    Import-Module Microsoft.PowerShell.PlatyPS
    $helpMarkdown = (Measure-PlatyPSMarkdown -Path src\Docker.PowerShell\Help\*.md |
        Where-Object FileType -match 'CommandHelp').FilePath

    # Prose lives in the markdown by hand and is not derivable from the assembly.
    $prose = 'Description','Synopsis','Examples','Notes','RelatedLinks','Inputs','Outputs',
             'Metadata','ModuleName','Aliases','AliasHeaderFound','ModuleGuid','Locale',
             'ExternalHelpFile','OnlineVersionUrl','Diagnostics'

    $drifted = @()
    foreach ($file in $helpMarkdown) {
      $documented = Import-MarkdownCommandHelp -Path $file
      $actual = New-CommandHelp -CommandInfo (Get-Command $documented.Title)
      # New-CommandHelp leaves this off the syntax items even for cmdlets that bind it.
      foreach ($syntax in $actual.Syntax) { $syntax.HasCmdletBinding = $true }
      $differences = Compare-CommandHelp -ReferenceCommandHelp $actual -DifferenceCommandHelp $documented -PropertyNamesToExclude $prose |
          Where-Object { $_ -match '^D ' }
      if ($differences) {
        $drifted += $documented.Title
        Write-Host "$($documented.Title):"
        $differences | ForEach-Object { Write-Host "  $_" }
      }
    }

    if ($drifted) {
      throw "Help files do not match updated cmdlets ($($drifted -join ', ')). Please update the help markdown to correspond to the latest changes."
    }
artifacts:
- path: testRepo/*.nupkg